[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wiki-market-intel"
version = "0.3.0"
description = "Market-intelligence engine built on Wikimedia pageview data: KPIs, not verdicts."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
# Direct dependencies are pinned. Transitives and hashes live in requirements.lock
# (runtime + pdf) and requirements-dev.lock (that plus pytest). Refresh with:
#   sh scripts/lock.sh
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "tenacity==9.1.4",
    "python-dateutil==2.9.0.post0",
    "jinja2==3.1.6",
    "matplotlib==3.10.9",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
pdf = ["reportlab==5.0.1"]
dev = ["pytest==9.1.1", "reportlab==5.0.1"]

[project.scripts]
wiki-market = "wiki_market_intel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_market_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls the live Wikimedia APIs (run with: pytest -m integration)"]
addopts = "-m 'not integration'"
